version: '3.8'

services:
  neo4j:
    image: neo4j:5.21-community
    container_name: inventory-neo4j-db
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/password123
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_security_procedures_unrestricted: apoc.*
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: inventory-neo4j-api
    restart: unless-stopped
    depends_on:
      neo4j:
        condition: service_healthy
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USERNAME: neo4j
      NEO4J_PASSWORD: password123
      NEO4J_DATABASE: neo4j
      OPENAI_API_KEY: ${OPENAI_API_KEY:-sk-mock-key}
      MODEL_NAME: ${MODEL_NAME:-gpt-4o-mini}
      JWT_SECRET: ${JWT_SECRET:-super_secret_neo4j_jwt_key_123456789}
      APP_ENV: production
      CORS_ORIGINS: '["http://localhost:3001", "http://localhost:5174", "http://localhost"]'
    ports:
      - "8001:8001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: inventory-neo4j-frontend
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "3001:80"

volumes:
  neo4j_data:
